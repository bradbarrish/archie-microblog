<header class="site-header">
  <div class="container">
    <h1 class="site-title">
      <a href="/">
        <img class="site-mark" src="https://bradbarrish.com/uploads/2026/brad-mark-30.jpg" alt="" width="30" height="30">
        <span>{{ .Site.Title | default "Brad Barrish" }}</span>
      </a>
    </h1>
    <nav class="site-nav">
      {{ with .Site.Menus.main }}
        {{ range . }}
          {{ if ne (lower .Name) "remembering mom" }}
          <a href="{{ .URL }}">{{ .Name }}</a>
          {{ end }}
        {{ end }}
      {{ else }}
      <a href="/about/">About</a>
      <a href="/archive/">Archive</a>
      <a href="/playlists/">Playlists</a>
      <a href="/subscribe/">Subscribe</a>
      {{ end }}
      <a href="/now/">Now</a>
      <button class="theme-toggle" aria-label="Toggle dark mode">dark</button>
    </nav>
  </div>
</header>
